x-model-volume: &model-volume
  type: bind
  source: ./models
  target: /models
  read_only: true

services:
  hf-downloader:
    # Single sanctioned path for pulling models from the Hugging Face Hub.
    # PREREQUISITE: goose, llama-swap, and ninfer consume artifacts from
    # ./models (the repo's model store) — all model downloads MUST go through
    # this container so artifacts land in the store those services bind-read.
    build:
      context: .
      dockerfile: Dockerfile.hf-downloader
    image: hf-downloader:local
    container_name: hf-downloader
    # Run as the host user (first-user uid 1000 on nearly all distros) so
    # downloaded artifacts are host-manageable; override per-host with
    # HOST_UID/HOST_GID in .env.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./models:/models
    environment:
      # Cache (xet + HTTP) lives under the mounted /models so it is writable
      # inside the container (the image's own $HOME is not mounted) and is
      # reused across runs.
      - HF_HOME=/models/.hf
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
    # Usage (CLI is `hf` in huggingface_hub 1.x; `huggingface-cli` is a dead stub):
    #   docker compose run --rm hf-downloader download <owner/repo> \
    #       --local-dir /models/<name> [--include "*.gguf"]

  goose:
    build:
      context: .
      dockerfile: goose.Dockerfile
    image: llama-stack-goose:local
    container_name: goose
    stdin_open: true
    tty: true
    environment:
      - GOOSE_CLI_SHOW_THINKING=true
      - GOOSE_CONFIG_PATH=/home/goose/.config/goose/config.yaml
    volumes:
      - ./goose/workspace:/workspace
      - ./goose/config.yaml:/home/goose/.config/goose/config.yaml
      # qdrant_rag extension resolves FastEmbed models from the shared model
      # store (FASTEMBED_CACHE_PATH=/models/.hf/hub in goose/config.yaml).
      - *model-volume
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3284:3284"
    # The image ENTRYPOINT is /usr/local/bin/goose with a default CMD of
    # --help, which printed CLI help and exited 0 -> docker restart-loop.
    # Compose `command` replaces only the CMD (ENTRYPOINT is kept), so this
    # runs: goose serve --host 0.0.0.0 --port 3284
    command: serve --host 0.0.0.0 --port 3284
    restart: unless-stopped

  llama-swap:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-swap:local
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_MAX_CONNECTIONS=1
    volumes:
      - *model-volume
      - ./llama-swap/config.yaml:/etc/llama-swap/config/config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-swap-exporter:
    image: ghcr.io/squat/llama-swap-exporter:latest
    container_name: llama-swap-exporter
    command:
      - --upstream=http://llama-swap:8080
    restart: unless-stopped
    ports:
      - "9101:9293"
    depends_on:
      - llama-swap

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  # --- TELEMETRY STACK ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3033:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  prometheus_data:
  grafana_data:

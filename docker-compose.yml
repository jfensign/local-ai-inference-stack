version: '3.8'

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap
    ports:
      - "8088:8080"
    volumes:
      - ~/models:/models
      - ./llama-swap/config.yaml:/etc/llama-swap/config/config.yaml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


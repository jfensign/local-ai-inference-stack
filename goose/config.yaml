# =============================================================================
# goose config for the docker-compose service "goose"
# Mounted at /home/goose/.config/goose/config.yaml (see docker-compose.yml).
#
# Provider chain:
#   goose -> llama-swap:8080 (OpenAI-compatible swap layer) -> ninfer-serve
#   (ninfer-serve subprocess on 127.0.0.1 inside the llama-swap container;
#   there is no standalone ninfer service since the unified-runtime
#   consolidation — see README "NInfer Runtime (Unified)")
#
# goose 1.30.0 compatibility notes (verified against the shipped binary):
#   - The CLI resolves provider/model from the FLAT keys GOOSE_PROVIDER /
#     GOOSE_MODEL (env or this file). The newer `active_provider` /
#     `providers:` block is NOT consulted by `goose run` in 1.30.0.
#   - There is no built-in "llama_swap" provider. The llama-swap endpoint is
#     consumed through the OpenAI-compatible provider via OPENAI_HOST.
#   - OPENAI_HOST is the endpoint root (no trailing path); requests go to
#     ${OPENAI_HOST}/v1/chat/completions by default (OPENAI_BASE_PATH).
#   - Single-file bind mount: goose's own config writes (migrations) fail
#     with EBUSY and are skipped - the repo file stays the source of truth.
# =============================================================================

# --- Provider (llama-swap swap layer, OpenAI-compatible) ---
GOOSE_PROVIDER: openai
GOOSE_MODEL: qwen3.8-27b
OPENAI_HOST: http://llama-swap:8080
OPENAI_API_KEY: sk-local

# --- Ollama (host instance, secondary) ---
# Switch with: goose run --provider ollama --model "hf.co/unsloth/Qwen3.6-27B-GGUF:UD-Q6_K_XL"
OLLAMA_HOST: http://host.docker.internal:11434

# --- Global settings ---
GOOSE_MAX_TURNS: 100
GOOSE_TELEMETRY_ENABLED: false
GOOSE_MODE: auto
GOOSE_CLI_MIN_PRIORITY: 0.0

GOOSE_SEARCH_PATHS:
  - /usr/local/bin
  - /usr/bin

extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true

  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true

  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true

  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true

  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true

  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true

  extensionmanager:
    enabled: true
    type: platform
    name: extensionmanager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true

  time:
    enabled: true
    type: stdio
    name: time
    cmd: uvx
    args:
      - --with
      - mcp<2
      - mcp-server-time
      - --local-timezone=Asia/Tokyo

  qdrant_rag:
    enabled: true
    type: stdio
    name: qdrant_rag
    description: Local Qdrant vector database for regulatory framework RAG queries.
    cmd: uvx
    args:
      - mcp-server-qdrant
    envs:
      QDRANT_URL: http://qdrant:6333
      # FastEmbed resolves its model cache from FASTEMBED_CACHE_PATH (read
      # directly by fastembed's define_cache_dir / TextEmbedding, so the env
      # var reaches the library). The HF hub cache layout is
      # <cache_dir>/models--<org>--<repo>/, and the models live under
      # ./models/.hf/hub in the store (hf-downloader sets HF_HOME=/models/.hf, so
      # hub/ is the cache root). Pointing this one level higher (/models/.hf)
      # makes snapshot_download look for models--qdrant--all-MiniLM-L6-v2-onnx
      # in the wrong place and fail offline.
      # The default embedding model (sentence-transformers/all-MiniLM-L6-v2)
      # maps to the preseeded HF repo qdrant/all-MiniLM-L6-v2-onnx, and the
      # derived vector name fast-all-minilm-l6-v2 matches the existing
      # compliance collections (384d, cosine).
      FASTEMBED_CACHE_PATH: /models/.hf/hub
      # The ONNX snapshot (qdrant/all-MiniLM-L6-v2-onnx) is preseeded in the
      # store; never touch the network from this extension.
      HF_HUB_OFFLINE: "1"
    timeout: 500

  goosedocs:
    enabled: true
    type: stdio
    name: goose Docs
    description: GitMCP for goose documentation
    cmd: npx
    args:
      - mcp-remote
      - https://block.gitmcp.io/goose/
    timeout: 300


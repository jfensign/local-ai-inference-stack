x-model-volume: &model-volume
  type: bind
  source: ${HOME}/models
  target: /models
  read_only: true

services:
  hf-downloader:
    image: python:3.11-slim
    container_name: hf-downloader
    volumes:
      # Maps host directory ./models to container path /models
      - ./models:/models
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
  goose:
    # Base image + uv (mcp-server-time, mcp-server-qdrant) + node (mcp-remote)
    # so the stdio extensions in goose/config.yaml can spawn in-container.
    build:
      context: .
      dockerfile: goose.Dockerfile
    image: llama-stack-goose:local
    container_name: goose
    stdin_open: true  # Keeps stdin open for interactive execution
    tty: true         # Allocates a pseudo-TTY for shell interaction
    environment:
      # Provider endpoint wiring lives in goose/config.yaml
      # (OPENAI_HOST -> llama-swap, OLLAMA_HOST -> host) so the repo file
      # stays the single source of truth.
      - GOOSE_CLI_SHOW_THINKING=true
      - GOOSE_CONFIG_PATH=/home/goose/.config/goose/config.yaml
    volumes:
      # Mount the project codebase you want Goose to operate on
      - ./goose/workspace:/workspace
      # Optional: Preserve Goose config and session state on host
      - ./goose/config.yaml:/home/goose/.config/goose/config.yaml
    working_dir: /workspace
    # Allows Goose to talk directly to other containers on your host network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  ninfer:
    build:
      context: https://github.com/Neroued/ninfer.git#master
      dockerfile: Dockerfile
    image: ninfer:local
    container_name: ninfer
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_MAX_CONNECTIONS=1
    volumes:
      - *model-volume
    expose:
      - "8087"
    ports:
      - "8087:8087"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      ninfer-serve /models/NInfer/qwen3_8_27b_nvfp4.ninfer
      --host 0.0.0.0
      --port 8087
      --spec mtp
      --draft-tokens 3
      --lm-head-draft
      --max-context 131072 
      --kv-capacity auto
      --kv-dtype int8
      --vision
  llama-swap:
    build: .
    container_name: llama-swap
    ports:
      - "8088:8080"
    volumes:
      - *model-volume
      - ./llama-swap/config.yaml:/etc/llama-swap/config/config.yaml
    restart: unless-stopped
    depends_on:
      - ninfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-swap-exporter:
    image: ghcr.io/squat/llama-swap-exporter:latest
    container_name: llama-swap-exporter
    command:
      - --upstream=http://llama-swap:8080
    restart: unless-stopped
    ports:
      - "9101:9293"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  # --- TELEMETRY STACK ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3033:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  prometheus_data:
  grafana_data:

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'llama-swap'
    static_configs:
      - targets: ['llama-swap:8080'] # Scrapes llama-swap container internally

  - job_name: 'llama-swap-metrics'
    static_configs:
      - targets: ['llama-swap-exporter:9293']

  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'ninfer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ninfer:8087'] # ninfer-serve /metrics (engine, HTTP, speculative, memory)

  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400'] # Scrapes GPU VRAM, power, and temps

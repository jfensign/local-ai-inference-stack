OPENAI_BASE_URL: http://llama-swap:8080/v1
OPENAI_API_KEY: sk-local
GOOSE_MAX_TURNS: 100
GOOSE_TELEMETRY_ENABLED: false
GOOSE_MODE: auto
GOOSE_CLI_MIN_PRIORITY: 0.0

GOOSE_SEARCH_PATHS:
  - /usr/local/bin
  - /usr/bin

active_provider: llama_swap
LLAMA_SWAP_HOST: http://llama-swap:8080

providers:
  ollama:
    enabled: true
    model: gemma4:31b
    configured: true
    host: http://host.docker.internal:11434
  llama_swap:
    enabled: true
    model: qwen3.8-27b
    configured: true
    host: http://llama-swap:8080/v1
    api_key: sk-local

extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true

  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true

  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true

  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true

  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true

  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true

  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true

  time:
    enabled: true
    type: stdio
    name: time
    cmd: uvx
    args:
      - --with
      - mcp<2
      - mcp-server-time
      - --local-timezone=Asia/Tokyo

  qdrant_rag:
    enabled: true
    type: stdio
    name: qdrant_rag
    description: Local Qdrant vector database for regulatory framework RAG queries.
    cmd: uvx
    args:
      - mcp-server-qdrant
    envs:
      QDRANT_URL: http://qdrant:6333
    timeout: 500

  goosedocs:
    enabled: true
    type: stdio
    name: goose Docs
    description: GitMCP for goose documentation
    cmd: npx
    args:
      - mcp-remote
      - https://block.gitmcp.io/goose/
    timeout: 300

  # --- Disabled Extensions (Kept for Reference) ---
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    display_name: Orchestrator
    bundled: true

  analyze:
    enabled: false
    type: platform
    name: analyze
    display_name: Analyze
    bundled: true

  code_execution:
    enabled: false
    type: platform
    name: code_execution
    display_name: Code Mode
    bundled: true

  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    display_name: Chat Recall
    bundled: true

  summarize:
    enabled: false
    type: platform
    name: summarize
    display_name: Summarize
    bundled: true

  apps:
    enabled: false
    type: platform
    name: apps
    display_name: Apps
    bundled: true

  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    bundled: true

  reddit:
    enabled: false
    type: stdio
    name: reddit
    cmd: uv
    args:
      - --directory
      - /workspace/mcp/lib/mcp-reddit
      - run
      - mcp-reddit
    envs:
      REDDIT_REFRESH_TOKEN: 25116490445867-LFOLaYeMfaOFiTiBG2MeA1dwm5M9Cg
      REDDIT_CLIENT_SECRET: rbXVndZ0GQ3sA90A9PUJzJ0D-K41DQ
      REDDIT_CLIENT_ID: 2Pb14ygJ9SAwQb1KWJPsSg
      REDDIT_USER_AGENT: mcp-reddit/1.0

  simple-pubmed:
    enabled: false
    type: stdio
    name: simple-pubmed
    cmd: uv
    args:
      - --directory
      - /workspace/mcp/lib/mcp-simple-pubmed
      - run
      - mcp-simple-pubmed

  playwright:
    enabled: false
    type: stdio
    name: playwright
    cmd: npx
    args:
      - -y
      - '@playwright/mcp@latest'
      - --isolated

  crypto:
    enabled: false
    type: stdio
    name: crypto
    cmd: uv
    args:
      - --directory
      - /workspace/mcp/lib/mcp-server-ccxt
      - run
      - src/server.py

  crypto-indicators-mcp:
    enabled: false
    type: stdio
    name: crypto-indicators-mcp
    cmd: node
    args:
      - /workspace/mcp/lib/crypto-indicators-mcp/index.js
    envs:
      EXCHANGE_NAME: binance

  agentic-tools:
    enabled: false
    type: stdio
    name: agentic-tools
    cmd: npx
    args:
      - -y
      - '@pimzino/agentic-tools-mcp'

  exa:
    enabled: false
    type: stdio
    name: exa
    cmd: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.exa.ai/mcp...

  sequential-thinking:
    enabled: false
    type: stdio
    name: sequential-thinking
    cmd: npx
    args:
      - -y
      - '@modelcontextprotocol/server-sequential-thinking'

  mcp-hn:
    enabled: false
    type: stdio
    name: mcp-hn
    cmd: uvx
    args:
      - mcp-hn

  openmemory:
    enabled: false
    type: stdio
    name: openmemory
    cmd: npx
    args:
      - -y
      - openmemory

  context7:
    enabled: false
    type: stdio
    name: context7
    cmd: npx
    args:
      - -y
      - '@upstash/context7-mcp'

  stocktwits:
    enabled: false
    type: stdio
    name: stocktwits
    cmd: npx
    args:
      - -y
      - github:stocktwits/stocktwits-mcp
    timeout: 300

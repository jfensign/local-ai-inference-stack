x-model-volume: &model-volume
  type: bind
  source: ./models
  target: /comfyui/models
  read_only: true

services:
  siyuan:
    image: b3log/siyuan
    container_name: siyuan
    restart: unless-stopped
    ports:
      - "6806:6806"
    volumes:
      - ./workspace:/siyuan/workspace
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - SIYUAN_ACCESS_AUTH_CODE=your_actual_password_here
    command: ["serve", "--workspace=/siyuan/workspace/"]
    networks:
      - ai-net 
  hf-downloader:
    # Single sanctioned path for pulling models from the Hugging Face Hub.
    # PREREQUISITE: goose, llama-swap, and ninfer consume artifacts from
    # ./models (the repo's model store) — all model downloads MUST go through
    # this container so artifacts land in the store those services bind-read.
    build:
      context: hf 
      dockerfile: Dockerfile
    image: hf-downloader:local
    container_name: hf-downloader
    # Run as the host user (first-user uid 1000 on nearly all distros) so
    # downloaded artifacts are host-manageable; override per-host with
    # HOST_UID/HOST_GID in .env.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./models:/models
    environment:
      # Cache (xet + HTTP) lives under the mounted /models so it is writable
      # inside the container (the image's own $HOME is not mounted) and is
      # reused across runs.
      - HF_HOME=/models/.hf
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
    # Usage (CLI is `hf` in huggingface_hub 1.x; `huggingface-cli` is a dead stub):
    #    docker compose run --rm hf-downloader download <owner/repo> \
    #       --local-dir /models/<name> [--include "*.gguf"]

  goose:
    build:
      context: goose
      dockerfile: Dockerfile
    image: llama-stack-goose:local
    container_name: goose
    stdin_open: true
    tty: true
    environment:
      - GOOSE_CLI_SHOW_THINKING=true
      - GOOSE_CONFIG_PATH=/home/goose/.config/goose/config.yaml
      # Image PATH is /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # (deduped); prepend /opt/craft/bin so shell-tool commands find the craft CLIs.
      - PATH=/opt/craft/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - REDDIT_USER_AGENT=mcp-reddit/1.0
      - REDDIT_CLIENT_ID=REDACTED
      - REDDIT_CLIENT_SECRET=REDACTED
      - REDIRECT_URI=http://localhost:8721/callback
      # siyuan lives on ai-net (not on goose's localhost); resolve by service name.
      - SIYUAN_BASE_URL=http://siyuan:6806
      - SIYUAN_DEFAULT_NOTEBOOK=My Notebook
      # API token (conf.json -> api.token; distinct from accessAuthCode which
      # gates the UI). Checked by kernel CheckAuth via Authorization: Token <token>.
      - SIYUAN_TOKEN=REDACTED

    volumes:
      - ./goose/workspace:/workspace
      - ./goose/config.yaml:/home/goose/.config/goose/config.yaml
      - ./goose/recipes:/home/goose/.config/goose/recipes
      # Global skills/plugins: goose discovers skills from ~/.agents/skills/
      # and installed plugins from ~/.agents/plugins/ (host ~ = /home/joseph).
      - ~/.agents:/home/goose/.agents
      # Craft CLIs, staged on the host (see goose/craft-bin/; copies, not symlinks —
      # bind mounts do not resolve link targets). Host: /usr/bin/*-craft-cli.
      - ./goose/craft-bin:/opt/craft/bin:ro
      # Persist goose session data (sessions.db) across container rebuilds.
      - ./goose/local-share:/home/goose/.local/share
      # DISABLED: shadowed the image's /usr/local/bin (goose, uv, uvx) when active,
      # breaking the entrypoint on recreate. Re-enable only if you install goose/uv
      # into the host's /usr/local/bin first.
      # - /usr/local/bin:/usr/local/bin
      # qdrant_rag extension resolves FastEmbed models from the shared model
      # store (FASTEMBED_CACHE_PATH=/models/.hf/hub in goose/config.yaml).
      - type: bind
        source: ./models
        target: /models
        read_only: true
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # llama-swap lives on ai-net; qdrant on the project default network.
    # Goose consumes both (OPENAI_HOST + QDRANT_URL), so it must join both.
    networks:
      - default
      - ai-net
    ports:
      - "3284:3284"
    # The image ENTRYPOINT is /usr/local/bin/goose with a default CMD of
    # --help, which printed CLI help and exited 0 -> docker restart-loop.
    # Compose `command` replaces only the CMD (ENTRYPOINT is kept), so this
    # runs: goose serve --host 0.0.0.0 --port 3284
    command: serve --host 0.0.0.0 --port 3284
    restart: unless-stopped

  pi-agent-harness:
    build:
      context: ./pi-agent-harness
      dockerfile: Dockerfile
    container_name: pi-agent-harness
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - ./:/workspace
    depends_on:
      - llama-swap
    ports:
      - "8002:8000"
    environment:
      - OPENAI_BASE_URL=http://llama-swap:8080/v1
      - OPENAI_API_KEY=dummy-key
    networks:
      - ai-net

  llama-swap:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-swap:local
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_MAX_CONNECTIONS=1
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
      - ./llama-swap/config.yaml:/etc/llama-swap/config/config.yaml
    networks:
      - ai-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-swap-exporter:
    image: ghcr.io/squat/llama-swap-exporter:latest
    container_name: llama-swap-exporter
    command:
      - --upstream=http://llama-swap:8080
    restart: unless-stopped
    ports:
      - "9101:9293"
    depends_on:
      - llama-swap
    # Upstream llama-swap lives on ai-net; without it the scrape fails
    # (llama_swap_up=0) and no ninfer_* / llamaswap_* series reach prometheus.
    networks:
      - default
      - ai-net

  

  comfyui:
    image: yanwk/comfyui-boot:cu130-slim-v2
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - .comfyui/models/extra_model_paths.yaml:/root/ComfyUI/extra_model_paths.yaml:ro
      # Cache & config persistence
      - ./comfyui/storage-cache/dot-cache:/root/.cache
      - ./comfyui/storage-cache/dot-config:/root/.config
      # Custom nodes & dependencies
      - ./comfyui/storage-nodes/dot-local:/root/.local
      - ./comfyui/storage-nodes/custom_nodes:/root/ComfyUI/custom_nodes
      # Models (Explicit bind mount for v2)
      - type: bind
        source: ./models
        target: /root/ComfyUI/models
        read_only: true
      - ./comfyui/storage-models/hf-hub:/root/.cache/huggingface/hub
      - ./comfyui/storage-models/torch-hub:/root/.cache/torch/hub
      # User data
      - ./comfyui/storage-user/input:/root/ComfyUI/input
      - ./comfyui/storage-user/output:/root/ComfyUI/output
      - ./comfyui/storage-user/user-profile:/root/ComfyUI/user
      - ./comfyui/storage-user/user-scripts:/root/user-scripts
    networks:
      - default
      - ai-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  siyuan-ai-companion:
    # RAG proxy over SiYuan notes: embeds note blocks into qdrant, retrieves
    # similar blocks per request, injects them into the prompt, and forwards
    # to an OpenAI-compatible LLM endpoint. Sits on the same RAG path as
    # goose's qdrant_rag extension (shared qdrant, distinct collection).
    image: siyuan-ai-companion:local
    # Upstream image + local patch (Content-Length/timeout fix, see companion/Dockerfile).
    # NOTE: the `testing` tag from the upstream docs is absent on Docker Hub;
    # the build bases off :latest.
    build:
      context: companion
      dockerfile: Dockerfile
    container_name: siyuan-ai-companion
    restart: always
    environment:
      - SIYUAN_URL=http://siyuan:6806
      # SiYuan api token (workspace conf.json -> api.token); same token goose uses.
      - SIYUAN_TOKEN=REDACTED
      - QDRANT_LOCATION=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=siyuan_ai_companion
      # LLM backend: local llama-swap swap layer (OpenAI-compatible), not the
      # public OpenAI API — 5090 protocol (GPU-first, local inference).
      - OPENAI_URL=http://llama-swap:8080/v1/
      # pydantic binding is openai_token -> OPENAI_TOKEN (not OPENAI_API_KEY).
      # llama-swap accepts any key; sk-local matches the goose convention.
      - OPENAI_TOKEN=sk-local
      # Auth token clients must present to call the companion's own API.
      - COMPANION_TOKEN=REDACTED
      # Gated embedding models: reuse the stack-wide HF token (see hf-downloader).
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
      # GPU is fully reserved by llama-swap; embeddings run on CPU.
      # - CUDA_VISIBLE_DEVICES=""
      # - COMPANION_LOGGING_LEVEL=INFO
    depends_on:
      - siyuan
      - qdrant
      - llama-swap
    ports:
      # Host 8000 is taken by mcpo-server (foreign project); container side stays 8000.
      - "8001:8000"
    # siyuan + llama-swap live on ai-net; qdrant on the project default network.
    # Companion consumes all three, so it must join both (same pattern as goose).
    networks:
      - default
      - ai-net

  # --- TELEMETRY STACK ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    # llama-swap + dcgm-exporter live on ai-net; prometheus must join it to resolve
    # those target names (previously: "lookup llama-swap on 127.0.0.11:53: no such host").
    networks:
      - default
      - ai-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3033:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  prometheus_data:
  grafana_data:

networks:
  ai-net:
    driver: bridge

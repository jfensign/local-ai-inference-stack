healthCheckTimeout: 180
globalTTL: 300

macros:
  base_gpu_profile: >
    llama-server
    --port ${PORT}
    --host 0.0.0.0
    --n-gpu-layers 99
    --cache-type-k q8_0
    --cache-type-v q8_0
    --flash-attn on
    --batch-size 2048
    --ubatch-size 512
    --threads 16
    --metrics

models:
  "qwen3.6:27b":
    cmd: >
      ${base_gpu_profile}
      --ctx-size 65536
      --model /models/unsloth/Qwen3.6-27B-Q5_K_M.gguf
      --mmproj /models/unsloth/Qwen3.6-27B-Q5_K_M-mmproj-qwen-27b-f16.gguf

  "qwen3.6:27b-ud-xl":
    cmd: >
      ${base_gpu_profile}
      --spec-type draft-mtp
      --spec-draft-n-max 4
      --spec-draft-p-min 0.3
      --parallel 1
      --ctx-size 112000
      --context-shift
      --model /models/unsloth/Qwen3.6-27B-UD-Q6_K_XL.gguf
      --mmproj /models/unsloth/Qwen3.6-27B-Q5_K_M-mmproj-qwen-27b-f16.gguf


  "qwen3.6-27b-instruct-q8-0":
    aliases:
      - "qwen3.6:27b-q8"
      - "qwen3.6-q8"
    cmd: >
      ${base_gpu_profile}
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --parallel 1
      --ctx-size 75536
      --context-shift
      --jinja
      --model /models/unsloth/Qwen3.6-27B-Q8_0.gguf
  "qwen3.6:35b-a3b-ud":
